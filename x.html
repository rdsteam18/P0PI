<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireChat - Google Login Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-track {
            background: #374151;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #6b7280;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .typing-dot {
            animation: pulse 1.5s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }
        .typing-dot:nth-child(2) {
            animation-delay: 0.5s;
        }
        .typing-dot:nth-child(3) {
            animation-delay: 1s;
        }
        
        @media (max-width: 768px) {
            .chat-container {
                grid-template-columns: 0 1fr;
            }
            .sidebar {
                display: none;
            }
            .show-sidebar .sidebar {
                display: block;
                position: absolute;
                width: 80%;
                height: 100%;
                z-index: 20;
            }
            .show-sidebar .chat-area {
                display: none;
            }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 h-screen overflow-hidden">
    <!-- Firebase Initialization -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCWQWPa3OEH6ClFQ5gv9yswr8N1Yh1vstE",
            authDomain: "study-chat-app-4a40e.firebaseapp.com",
            projectId: "study-chat-app-4a40e",
            storageBucket: "study-chat-app-4a40e.appspot.com",
            messagingSenderId: "458309548485",
            appId: "1:458309548485:web:5dcccac12a7487b0d273ac"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // Google Auth Provider
        const provider = new firebase.auth.GoogleAuthProvider();
    </script>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 rounded-lg p-6 w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Welcome to FireChat</h2>
                <button id="closeAuthModal" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="text-center py-4">
                <button id="googleLoginBtn" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded flex items-center justify-center">
                    <i class="fab fa-google mr-2"></i> Login with Google
                </button>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="appContainer" class="h-full hidden">
        <!-- Header -->
        <header class="bg-white dark:bg-gray-800 shadow-sm py-3 px-4 flex items-center justify-between">
            <div class="flex items-center">
                <button id="menuBtn" class="mr-4 md:hidden">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="text-xl font-bold">FireChat</h1>
            </div>
            
            <div class="flex items-center space-x-4">
                <button id="darkModeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:block"></i>
                </button>
                
                <div class="relative">
                    <button id="profileBtn" class="flex items-center space-x-2">
                        <img id="userPhoto" src="https://via.placeholder.com/40" alt="Profile" class="w-8 h-8 rounded-full">
                        <span id="userName" class="hidden md:inline">User</span>
                    </button>
                    <div id="profileDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-md shadow-lg py-1 z-50">
                        <a href="#" id="logoutBtn" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700">Logout</a>
                    </div>
                </div>
            </div>
        </header>
        
        <!-- Main Content -->
        <div class="flex h-[calc(100%-56px)]">
            <!-- Chat Container -->
            <div id="chatContainer" class="chat-container grid grid-cols-4 h-full w-full">
                <!-- Sidebar -->
                <div id="sidebar" class="sidebar bg-white dark:bg-gray-800 border-r dark:border-gray-700 overflow-hidden flex flex-col">
                    <!-- Search -->
                    <div class="p-3 border-b dark:border-gray-700">
                        <div class="relative">
                            <input type="text" placeholder="Search chats..." class="w-full pl-10 pr-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 focus:outline-none">
                            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                        </div>
                    </div>
                    
                    <!-- Chat List -->
                    <div class="flex-1 overflow-y-auto custom-scrollbar">
                        <div class="p-2">
                            <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-2">RECENT CHATS</h3>
                            <div id="chatList" class="space-y-1">
                                <!-- Chats will be loaded here -->
                            </div>
                        </div>
                    </div>
                    
                    <!-- New Chat Button -->
                    <div class="p-3 border-t dark:border-gray-700">
                        <button id="newChatBtn" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded flex items-center justify-center">
                            <i class="fas fa-plus mr-2"></i> New Chat
                        </button>
                    </div>
                </div>
                
                <!-- Chat Area -->
                <div id="chatArea" class="chat-area col-span-3 bg-gray-50 dark:bg-gray-900 flex flex-col">
                    <!-- Chat Header -->
                    <div id="chatHeader" class="bg-white dark:bg-gray-800 p-3 border-b dark:border-gray-700 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="relative">
                                <img id="currentChatPhoto" src="https://via.placeholder.com/40" alt="Chat" class="w-10 h-10 rounded-full">
                                <div id="currentChatStatus" class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white dark:border-gray-800"></div>
                            </div>
                            <div>
                                <h3 id="currentChatName" class="font-semibold">Select a chat</h3>
                                <p id="currentChatStatusText" class="text-xs text-gray-500 dark:text-gray-400">Online</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Messages Area -->
                    <div id="messagesArea" class="flex-1 overflow-y-auto p-4 custom-scrollbar space-y-4">
                        <div class="text-center text-gray-500 dark:text-gray-400 py-4">
                            Select a chat to start messaging
                        </div>
                    </div>
                    
                    <!-- Typing Indicator -->
                    <div id="typingIndicator" class="hidden px-4 py-2 bg-gray-100 dark:bg-gray-800 text-sm text-gray-500 dark:text-gray-400">
                        <div class="flex items-center">
                            <span id="typingUser" class="font-medium mr-2"></span>
                            <div class="flex space-x-1">
                                <div class="typing-dot w-2 h-2 bg-gray-500 rounded-full"></div>
                                <div class="typing-dot w-2 h-2 bg-gray-500 rounded-full"></div>
                                <div class="typing-dot w-2 h-2 bg-gray-500 rounded-full"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Message Input -->
                    <div class="bg-white dark:bg-gray-800 p-3 border-t dark:border-gray-700">
                        <div class="flex items-center space-x-2">
                            <div class="flex-1">
                                <input type="text" id="messageInput" placeholder="Type a message..." class="w-full px-4 py-2 rounded-full bg-gray-100 dark:bg-gray-700 focus:outline-none">
                            </div>
                            
                            <button id="sendBtn" class="p-2 text-blue-500 hover:text-blue-600">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- New Chat Modal -->
        <div id="newChatModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
            <div class="bg-white dark:bg-gray-800 rounded-lg p-6 w-full max-w-md">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">New Chat</h2>
                    <button id="closeNewChatModal" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <div class="mb-4">
                    <div class="relative">
                        <input type="text" id="searchUsersInput" placeholder="Search users..." class="w-full pl-10 pr-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 focus:outline-none">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    </div>
                </div>
                
                <div id="userSearchResults" class="max-h-64 overflow-y-auto custom-scrollbar">
                    <!-- Users will be listed here -->
                </div>
            </div>
        </div>
    </div>

    <!-- App Script -->
    <script>
        // DOM Elements
        const authModal = document.getElementById('authModal');
        const appContainer = document.getElementById('appContainer');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const closeAuthModal = document.getElementById('closeAuthModal');
        const logoutBtn = document.getElementById('logoutBtn');
        const darkModeToggle = document.getElementById('darkModeToggle');
        const profileBtn = document.getElementById('profileBtn');
        const profileDropdown = document.getElementById('profileDropdown');
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const chatArea = document.getElementById('chatArea');
        const chatContainer = document.getElementById('chatContainer');
        const newChatBtn = document.getElementById('newChatBtn');
        const newChatModal = document.getElementById('newChatModal');
        const closeNewChatModal = document.getElementById('closeNewChatModal');
        const searchUsersInput = document.getElementById('searchUsersInput');
        const userSearchResults = document.getElementById('userSearchResults');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesArea = document.getElementById('messagesArea');
        const typingIndicator = document.getElementById('typingIndicator');
        const chatList = document.getElementById('chatList');
        const currentChatName = document.getElementById('currentChatName');
        const currentChatPhoto = document.getElementById('currentChatPhoto');
        const currentChatStatus = document.getElementById('currentChatStatus');
        const currentChatStatusText = document.getElementById('currentChatStatusText');
        const userPhoto = document.getElementById('userPhoto');
        const userName = document.getElementById('userName');

        // App State
        let currentUser = null;
        let currentChat = null;
        let typingTimeout = null;

        // Initialize the app
        function init() {
            // Check auth state
            auth.onAuthStateChanged(user => {
                if (user) {
                    // User is signed in
                    currentUser = user;
                    setupUser(user);
                    authModal.classList.add('hidden');
                    appContainer.classList.remove('hidden');
                    loadChats();
                } else {
                    // No user is signed in
                    currentUser = null;
                    authModal.classList.remove('hidden');
                    appContainer.classList.add('hidden');
                }
            });
            
            // Setup event listeners
            setupEventListeners();
        }

        // Setup event listeners
        function setupEventListeners() {
            // Auth modal
            closeAuthModal.addEventListener('click', () => {
                authModal.classList.add('hidden');
            });
            
            // Google login
            googleLoginBtn.addEventListener('click', loginWithGoogle);
            
            // App controls
            darkModeToggle.addEventListener('click', toggleDarkMode);
            profileBtn.addEventListener('click', toggleProfileDropdown);
            document.addEventListener('click', (e) => {
                if (!profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
                    profileDropdown.classList.add('hidden');
                }
            });
            
            // Chat navigation
            menuBtn.addEventListener('click', toggleSidebar);
            
            // New chat
            newChatBtn.addEventListener('click', openNewChatModal);
            closeNewChatModal.addEventListener('click', closeNewChatModalFunc);
            
            // Message input
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            messageInput.addEventListener('input', () => {
                if (currentChat) {
                    updateTypingStatus(true);
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => {
                        updateTypingStatus(false);
                    }, 2000);
                }
            });
            
            sendBtn.addEventListener('click', sendMessage);
            
            // Logout
            logoutBtn.addEventListener('click', logout);
        }

        // Auth functions
        function loginWithGoogle() {
            auth.signInWithPopup(provider)
                .then((result) => {
                    // Check if user exists in Firestore
                    const user = result.user;
                    return db.collection('users').doc(user.uid).get();
                })
                .then((doc) => {
                    if (!doc.exists) {
                        // Create user document if it doesn't exist
                        const user = auth.currentUser;
                        return db.collection('users').doc(user.uid).set({
                            name: user.displayName,
                            email: user.email,
                            photoURL: user.photoURL,
                            status: "Hey there! I'm using FireChat",
                            lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                            online: true
                        });
                    }
                })
                .catch(error => {
                    alert(error.message);
                });
        }
        
        function logout() {
            if (currentUser) {
                // Update user status to offline
                db.collection('users').doc(currentUser.uid).update({
                    online: false,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
            
            auth.signOut().then(() => {
                // Success - handled by auth state listener
            }).catch(error => {
                alert(error.message);
            });
        }

        // User setup
        function setupUser(user) {
            // Set user info in header
            userName.textContent = user.displayName || 'User';
            userPhoto.src = user.photoURL || 'https://via.placeholder.com/40';
            
            // Set user online status
            db.collection('users').doc(user.uid).update({
                online: true,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            // Set up presence detection
            setupPresence(user.uid);
        }
        
        function setupPresence(userId) {
            const userStatusDatabaseRef = db.collection('users').doc(userId);
            
            // Set up realtime listener for user status
            userStatusDatabaseRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    // Update UI if this user is in current chat
                    if (currentChat && currentChat.uid === userId) {
                        updateUserStatus(data);
                    }
                }
            });
            
            // Update status when window loses focus
            window.addEventListener('focus', () => {
                userStatusDatabaseRef.update({
                    online: true,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                });
            });
            
            window.addEventListener('blur', () => {
                userStatusDatabaseRef.update({
                    online: false,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                });
            });
            
            // Update status before page unload
            window.addEventListener('beforeunload', () => {
                userStatusDatabaseRef.update({
                    online: false,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                });
            });
        }

        // Chat functions
        function loadChats() {
            if (!currentUser) return;
            
            // Load one-to-one chats
            db.collection('chats')
                .where('participants', 'array-contains', currentUser.uid)
                .orderBy('lastMessage.timestamp', 'desc')
                .onSnapshot(snapshot => {
                    chatList.innerHTML = '';
                    
                    snapshot.forEach(doc => {
                        const chat = doc.data();
                        const otherUserId = chat.participants.find(id => id !== currentUser.uid);
                        
                        // Get other user's details
                        db.collection('users').doc(otherUserId).get().then(userDoc => {
                            if (userDoc.exists) {
                                const user = userDoc.data();
                                addChatToList(chat.id, user, chat.lastMessage);
                            }
                        });
                    });
                });
        }
        
        function addChatToList(chatId, user, lastMessage) {
            const chatElement = document.createElement('div');
            chatElement.className = 'flex items-center p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer';
            chatElement.dataset.chatId = chatId;
            chatElement.dataset.userId = user.uid;
            
            let lastMessageText = lastMessage?.text || 'No messages yet';
            if (lastMessageText.length > 20) {
                lastMessageText = lastMessageText.substring(0, 20) + '...';
            }
            
            const timeAgo = lastMessage?.timestamp ? formatTime(lastMessage.timestamp.toDate()) : '';
            
            chatElement.innerHTML = `
                <div class="relative mr-3">
                    <img src="${user.photoURL || 'https://via.placeholder.com/40'}" alt="${user.name}" class="w-10 h-10 rounded-full">
                    ${user.online ? '<div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white dark:border-gray-800"></div>' : ''}
                </div>
                <div class="flex-1">
                    <h4 class="font-medium">${user.name}</h4>
                    <p class="text-xs text-gray-500 dark:text-gray-400 truncate">${lastMessageText}</p>
                </div>
                <div class="text-xs text-gray-500 dark:text-gray-400">${timeAgo}</div>
            `;
            
            chatElement.addEventListener('click', () => {
                openChat(chatId, user, false);
            });
            
            chatList.appendChild(chatElement);
        }
        
        function openChat(chatId, user, isNew = false) {
            currentChat = user;
            
            // Update UI
            currentChatName.textContent = user.name;
            currentChatPhoto.src = user.photoURL || 'https://via.placeholder.com/40';
            currentChatStatus.style.display = user.online ? 'block' : 'none';
            currentChatStatusText.textContent = user.online ? 'Online' : formatLastSeen(user.lastSeen?.toDate());
            
            // Load messages
            loadMessages(chatId);
            
            // Set up typing listener
            setupTypingListener(chatId);
            
            // Close sidebar on mobile
            if (window.innerWidth < 768) {
                chatContainer.classList.remove('show-sidebar');
            }
            
            // If this is a new chat, create the chat document
            if (isNew) {
                db.collection('chats').doc(chatId).set({
                    participants: [currentUser.uid, user.uid],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastMessage: null
                });
            }
        }
        
        function loadMessages(chatId) {
            messagesArea.innerHTML = '';
            
            db.collection('messages').doc(chatId).collection('messages')
                .orderBy('timestamp', 'desc')
                .limit(20)
                .onSnapshot(snapshot => {
                    messagesArea.innerHTML = '';
                    
                    const messages = [];
                    snapshot.forEach(doc => {
                        messages.unshift(doc.data());
                    });
                    
                    if (messages.length === 0) {
                        messagesArea.innerHTML = `
                            <div class="text-center text-gray-500 dark:text-gray-400 py-4">
                                No messages yet. Start the conversation!
                            </div>
                        `;
                        return;
                    }
                    
                    messages.forEach(message => {
                        addMessageToChat(message);
                    });
                    
                    // Scroll to bottom
                    setTimeout(() => {
                        messagesArea.scrollTop = messagesArea.scrollHeight;
                    }, 100);
                });
        }
        
        function addMessageToChat(message) {
            const isCurrentUser = message.senderId === currentUser.uid;
            const messageTime = formatTime(message.timestamp.toDate());
            
            const messageElement = document.createElement('div');
            messageElement.className = `flex ${isCurrentUser ? 'justify-end' : 'justify-start'} mb-4`;
            
            messageElement.innerHTML = `
                <div class="flex ${isCurrentUser ? 'flex-row-reverse' : ''} max-w-xs md:max-w-md">
                    ${!isCurrentUser ? `
                        <img src="${message.senderPhoto || 'https://via.placeholder.com/40'}" 
                             alt="${message.senderName}" 
                             class="w-8 h-8 rounded-full self-end mr-2">
                    ` : ''}
                    
                    <div class="${isCurrentUser ? 'bg-blue-500 text-white' : 'bg-gray-200 dark:bg-gray-700'} rounded-lg p-3">
                        <p class="text-gray-800 dark:text-gray-200">${message.text}</p>
                        
                        <div class="flex items-center justify-end mt-1 space-x-1">
                            <span class="text-xs ${isCurrentUser ? 'text-blue-100' : 'text-gray-500 dark:text-gray-400'}">
                                ${messageTime}
                            </span>
                            
                            ${isCurrentUser ? `
                                <span class="text-xs ${message.read ? 'text-blue-300' : 'text-blue-100'}">
                                    ${message.read ? '✓✓' : '✓'}
                                </span>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
            
            messagesArea.appendChild(messageElement);
            
            // Mark as read if it's not our message
            if (!isCurrentUser && !message.read) {
                markMessageAsRead(message);
            }
        }
        
        function sendMessage() {
            const messageText = messageInput.value.trim();
            if (!messageText || !currentChat) return;
            
            const chatId = getChatId(currentUser.uid, currentChat.uid);
            
            const message = {
                text: messageText,
                senderId: currentUser.uid,
                senderName: currentUser.displayName,
                senderPhoto: currentUser.photoURL,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                type: 'text',
                read: false
            };
            
            // Add message to collection
            db.collection('messages').doc(chatId).collection('messages').add(message)
                .then(() => {
                    // Update last message in chat
                    db.collection('chats').doc(chatId).update({
                        lastMessage: {
                            text: messageText,
                            senderId: currentUser.uid,
                            timestamp: message.timestamp
                        }
                    });
                    
                    // Clear input
                    messageInput.value = '';
                    
                    // Scroll to bottom
                    setTimeout(() => {
                        messagesArea.scrollTop = messagesArea.scrollHeight;
                    }, 100);
                })
                .catch(error => {
                    console.error('Error sending message:', error);
                });
        }
        
        function markMessageAsRead(message) {
            const chatId = getChatId(currentUser.uid, currentChat.uid);
            db.collection('messages').doc(chatId).collection('messages').doc(message.id).update({
                read: true
            });
        }
        
        function setupTypingListener(chatId) {
            db.collection('typing').doc(chatId).onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    const typingUsers = data.users || [];
                    
                    // Filter out current user
                    const otherUsersTyping = typingUsers.filter(uid => uid !== currentUser.uid);
                    
                    if (otherUsersTyping.length > 0) {
                        // Get names of typing users
                        const userPromises = otherUsersTyping.map(uid => 
                            db.collection('users').doc(uid).get()
                        );
                        
                        Promise.all(userPromises).then(snapshots => {
                            const names = snapshots
                                .filter(snap => snap.exists)
                                .map(snap => snap.data().name);
                            
                            if (names.length > 0) {
                                typingUser.textContent = `${names[0]} is typing...`;
                                typingIndicator.classList.remove('hidden');
                            }
                        });
                    } else {
                        typingIndicator.classList.add('hidden');
                    }
                } else {
                    typingIndicator.classList.add('hidden');
                }
            });
        }
        
        function updateTypingStatus(isTyping) {
            if (!currentChat) return;
            
            const chatId = getChatId(currentUser.uid, currentChat.uid);
            
            if (isTyping) {
                db.collection('typing').doc(chatId).set({
                    users: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
                }, { merge: true });
            } else {
                db.collection('typing').doc(chatId).update({
                    users: firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
                });
            }
        }

        // New chat functions
        function openNewChatModal() {
            newChatModal.classList.remove('hidden');
            searchUsersInput.value = '';
            userSearchResults.innerHTML = '';
            
            // Load users (excluding current user)
            db.collection('users')
                .where('uid', '!=', currentUser.uid)
                .get()
                .then(snapshot => {
                    snapshot.forEach(doc => {
                        const user = doc.data();
                        addUserToSearchResults(user);
                    });
                });
        }
        
        function closeNewChatModalFunc() {
            newChatModal.classList.add('hidden');
        }
        
        function addUserToSearchResults(user) {
            const userElement = document.createElement('div');
            userElement.className = 'flex items-center p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded cursor-pointer';
            userElement.dataset.userId = user.uid;
            
            userElement.innerHTML = `
                <img src="${user.photoURL || 'https://via.placeholder.com/40'}" alt="${user.name}" class="w-8 h-8 rounded-full mr-3">
                <div>
                    <h4 class="font-medium">${user.name}</h4>
                    <p class="text-xs text-gray-500 dark:text-gray-400">${user.status || ''}</p>
                </div>
            `;
            
            userElement.addEventListener('click', () => {
                const chatId = getChatId(currentUser.uid, user.uid);
                openChat(chatId, user, true);
                closeNewChatModalFunc();
            });
            
            userSearchResults.appendChild(userElement);
        }

        // UI Helper functions
        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('darkMode', 'false');
            } else {
                html.classList.add('dark');
                localStorage.setItem('darkMode', 'true');
            }
        }
        
        function toggleProfileDropdown() {
            profileDropdown.classList.toggle('hidden');
        }
        
        function toggleSidebar() {
            chatContainer.classList.toggle('show-sidebar');
        }
        
        function updateUserStatus(userData) {
            currentChatStatus.style.display = userData.online ? 'block' : 'none';
            currentChatStatusText.textContent = userData.online 
                ? 'Online' 
                : formatLastSeen(userData.lastSeen?.toDate());
        }
        
        // Utility functions
        function getChatId(user1, user2) {
            return [user1, user2].sort().join('_');
        }
        
        function formatTime(date) {
            if (!date) return '';
            return date.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }
        
        function formatLastSeen(date) {
            if (!date) return 'a long time ago';
            
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / (1000 * 60));
            
            if (minutes < 1) return 'just now';
            if (minutes < 60) return `${minutes} min ago`;
            
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} hour${hours > 1 ? 's' : ''} ago`;
            
            const days = Math.floor(hours / 24);
            return `${days} day${days > 1 ? 's' : ''} ago`;
        }

        // Initialize the app
        init();

        // Check for saved dark mode preference
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
