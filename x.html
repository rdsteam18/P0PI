<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P0PI - Chat App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom CSS from user, plus enhancements */
    .notification {
      animation: slideIn 0.3s ease-out, fadeOut 0.5s ease-in 4s forwards;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    .message-enter {
      animation: messageEnter 0.3s ease-out;
    }
    @keyframes messageEnter {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    /* Custom scrollbar for a cleaner look */
    #messages-area::-webkit-scrollbar,
    #sidebar-content::-webkit-scrollbar {
      width: 6px;
    }
    #messages-area::-webkit-scrollbar-track,
    #sidebar-content::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    #messages-area::-webkit-scrollbar-thumb,
    #sidebar-content::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 3px;
    }
    #messages-area::-webkit-scrollbar-thumb:hover,
    #sidebar-content::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
    
    /* Additional styles for a polished UI */
    .chat-bubble {
      max-width: 75%;
    }
    .chat-bubble-user {
        background-color: #4f46e5;
        color: white;
    }
    .chat-bubble-other {
        background-color: #ffffff;
    }
    .gemini-btn {
        background: linear-gradient(45deg, #4f46e5, #818cf8);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .gemini-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
    }
    .gemini-btn:disabled {
        background: #a5b4fc;
        cursor: not-allowed;
        transform: scale(1);
        box-shadow: none;
    }
    /* Accordion styles */
    .accordion-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-out;
    }
  </style>
</head>
<body class="bg-gray-100 h-screen font-sans overflow-hidden">

  <!-- Main Application Container -->
  <div id="app" class="h-full flex antialiased text-gray-800">

    <!-- Authentication Screen -->
    <div id="auth-screen" class="w-full h-full flex items-center justify-center bg-indigo-50 p-4">
      <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
        <h1 class="text-3xl font-bold text-indigo-700 mb-6 text-center flex items-center justify-center">
          <i class="fas fa-graduation-cap mr-2"></i>P0PI
        </h1>
        <div id="auth-container">
          <!-- Login Form -->
          <div id="login-form">
            <input type="email" id="login-email" placeholder="Email" class="w-full p-3 mb-4 bg-gray-100 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="password" id="login-password" placeholder="Password" class="w-full p-3 mb-4 bg-gray-100 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button id="login-btn" class="w-full bg-indigo-600 text-white p-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors">Login</button>
            <p class="text-center text-gray-500 my-4">OR</p>
            <button id="google-login-btn" class="w-full bg-white border border-gray-300 p-3 rounded-lg flex items-center justify-center hover:bg-gray-50 transition-colors">
              <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google logo" class="w-6 h-6 mr-2"> Login with Google
            </button>
            <p class="text-center mt-6">
              Don't have an account? <a href="#" id="show-register" class="text-indigo-600 font-semibold">Register</a>
            </p>
          </div>
          <!-- Registration Form (hidden by default) -->
          <div id="register-form" class="hidden">
            <input type="text" id="register-name" placeholder="Full Name" class="w-full p-3 mb-4 bg-gray-100 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="email" id="register-email" placeholder="Email" class="w-full p-3 mb-4 bg-gray-100 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="password" id="register-password" placeholder="Password" class="w-full p-3 mb-4 bg-gray-100 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button id="register-btn" class="w-full bg-indigo-600 text-white p-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors">Register</button>
            <p class="text-center mt-6">
              Already have an account? <a href="#" id="show-login" class="text-indigo-600 font-semibold">Login</a>
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Chat Interface (hidden by default) -->
    <div id="chat-screen" class="hidden w-full h-full flex">
      <!-- Sidebar -->
      <aside id="sidebar" class="w-full md:w-1/3 lg:w-1/4 bg-white border-r border-gray-200 flex flex-col transition-transform duration-300 ease-in-out">
        <!-- Sidebar Header -->
        <header class="p-4 border-b border-gray-200 flex justify-between items-center flex-shrink-0">
          <div id="user-profile" class="flex items-center cursor-pointer">
            <!-- User profile info will be injected here -->
          </div>
          <div class="flex items-center space-x-4">
             <button id="logout-btn" class="text-gray-500 hover:text-indigo-600" title="Logout">
                <i class="fas fa-sign-out-alt text-xl"></i>
             </button>
          </div>
        </header>
        
        <!-- Sidebar Content -->
        <div id="sidebar-content" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Search Section -->
            <div class="bg-white p-4 rounded-lg shadow">
              <h3 class="font-semibold text-lg mb-3 text-gray-800">
                <i class="fas fa-search mr-2 text-indigo-600"></i>Find Study Partners
              </h3>
              <input type="text" id="searchInput" placeholder="Search by name (min 2 chars)"
                     class="w-full p-2 border border-gray-300 rounded-lg mb-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
              <div id="searchResults" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </div>

            <!-- Friend Requests -->
            <div class="bg-white p-4 rounded-lg shadow">
                <button class="accordion-header w-full flex justify-between items-center">
                    <h3 class="font-semibold text-lg text-gray-800">
                      <i class="fas fa-user-clock mr-2 text-indigo-600"></i>Friend Requests
                    </h3>
                    <div class="flex items-center">
                        <span id="requestCount" class="bg-indigo-100 text-indigo-800 text-xs font-medium px-2.5 py-0.5 rounded-full mr-2"></span>
                        <i class="fas fa-chevron-down accordion-icon transition-transform"></i>
                    </div>
                </button>
                <div id="friendRequests" class="accordion-content mt-2 space-y-2">
                    <div class="text-gray-500 text-center py-4">No friend requests</div>
                </div>
            </div>

            <!-- Friends List -->
            <div class="bg-white p-4 rounded-lg shadow">
                 <button class="accordion-header w-full flex justify-between items-center">
                    <h3 class="font-semibold text-lg text-gray-800">
                      <i class="fas fa-user-friends mr-2 text-indigo-600"></i>Friends List
                    </h3>
                    <div class="flex items-center">
                        <span id="friendCount" class="bg-indigo-100 text-indigo-800 text-xs font-medium px-2.5 py-0.5 rounded-full mr-2"></span>
                        <i class="fas fa-chevron-down accordion-icon transition-transform"></i>
                    </div>
                </button>
                <div id="friendsList" class="accordion-content mt-2 space-y-2">
                    <div class="text-gray-500 text-center py-4">No friends yet</div>
                </div>
            </div>
        </div>
      </aside>

      <!-- Main Chat Window -->
      <main id="main-chat" class="w-full flex-col absolute md:relative h-full md:w-2/3 lg:w-3/4 transform translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="flex-1 flex flex-col items-center justify-center text-center bg-gray-50 h-full">
            <i class="fas fa-comments text-8xl text-gray-300"></i>
            <h2 class="mt-4 text-2xl font-semibold text-gray-600">Welcome to P0PI Chat</h2>
            <p class="text-gray-500">Select a friend to start messaging</p>
        </div>
        
        <!-- Chat Area (hidden by default) -->
        <div id="chat-area" class="hidden flex-1 flex-col h-full">
            <!-- Chat Header -->
            <header id="chat-header" class="p-4 bg-white border-b border-gray-200 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center">
                    <button id="back-to-sidebar" class="md:hidden text-gray-500 mr-4">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <!-- Chat partner info will be injected here -->
                </div>
               <button id="summarize-chat-btn" class="gemini-btn text-white py-2 px-4 rounded-lg text-sm flex items-center">
                    ✨ Summarize
                </button>
            </header>
            <!-- Messages Area -->
            <div id="messages-area" class="flex-1 p-4 overflow-y-auto bg-indigo-50">
              <!-- Messages will be injected here -->
            </div>
            <!-- Message Input -->
            <footer class="p-4 bg-white border-t">
              <div class="flex items-center">
                <button class="text-gray-500 mr-4 text-xl hover:text-indigo-600">
                  <i class="fas fa-smile"></i>
                </button>
                <input type="text" id="message-input" placeholder="Type a message..." class="flex-1 p-3 border rounded-full bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button id="suggest-reply-btn" class="gemini-btn text-white w-12 h-12 rounded-full ml-4 flex items-center justify-center" title="Suggest Reply">
                    ✨
                </button>
                <button id="send-btn" class="bg-indigo-600 text-white w-12 h-12 rounded-full ml-2 flex items-center justify-center hover:bg-indigo-700 transition-colors">
                  <i class="fas fa-paper-plane text-xl"></i>
                </button>
              </div>
            </footer>
        </div>
      </main>
    </div>
    
    <!-- Notification Container -->
    <div id="notification-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

  </div>

  <script type="module">
    // Firebase SDK imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signInWithPopup, 
      GoogleAuthProvider, 
      onAuthStateChanged, 
      signOut,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc,
      collection,
      addDoc,
      serverTimestamp,
      query,
      orderBy,
      onSnapshot,
      where,
      updateDoc,
      arrayUnion,
      arrayRemove
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCWQWPa3OEH6ClFQ5gv9yswr8N1Yh1vstE",
      authDomain: "study-chat-app-4a40e.firebaseapp.com",
      projectId: "study-chat-app-4a40e",
      storageBucket: "study-chat-app-4a40e.appspot.com",
      messagingSenderId: "458309548485",
      appId: "1:458309548485:web:5dcccac12a7487b0d273ac",
      measurementId: "G-HQTQLDYT0Q"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // DOM Elements
    const authScreen = document.getElementById('auth-screen');
    const chatScreen = document.getElementById('chat-screen');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const showRegister = document.getElementById('show-register');
    const showLogin = document.getElementById('show-login');
    const welcomeScreen = document.getElementById('welcome-screen');
    const chatArea = document.getElementById('chat-area');
    const messagesArea = document.getElementById('messages-area');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const chatHeader = document.getElementById('chat-header');
    const suggestReplyBtn = document.getElementById('suggest-reply-btn');
    const summarizeChatBtn = document.getElementById('summarize-chat-btn');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const friendRequestsContainer = document.getElementById('friendRequests');
    const friendsListContainer = document.getElementById('friendsList');
    const requestCountBadge = document.getElementById('requestCount');
    const friendCountBadge = document.getElementById('friendCount');
    const sidebar = document.getElementById('sidebar');
    const mainChat = document.getElementById('main-chat');
    const backToSidebarBtn = document.getElementById('back-to-sidebar');


    let currentChatPartner = null;
    let unsubscribeMessages = null;
    let unsubscribeFriends = null;
    let unsubscribeRequests = null;
    let currentChatHistory = [];

    // --- Gemini API Integration ---
    async function callGeminiApi(prompt, button) {
        if (button) button.disabled = true;
        
        let chatHistory = [];
        chatHistory.push({ role: "user", parts: [{ text: prompt }] });
        const payload = { contents: chatHistory };
        const apiKey = ""; // API key is handled by the environment
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error(`API call failed with status: ${response.status}`);
            }

            const result = await response.json();
            if (result.candidates && result.candidates.length > 0 &&
                result.candidates[0].content && result.candidates[0].content.parts &&
                result.candidates[0].content.parts.length > 0) {
                return result.candidates[0].content.parts[0].text;
            } else {
                throw new Error("Invalid response structure from API.");
            }
        } catch (error) {
            console.error("Gemini API call failed:", error);
            showNotification('error', 'AI feature failed. Please try again.');
            return null;
        } finally {
            if (button) button.disabled = false;
        }
    }
    
    suggestReplyBtn.addEventListener('click', async (e) => {
        if (!auth.currentUser) return;
        if (currentChatHistory.length === 0) {
            showNotification('info', 'Not enough chat history to suggest a reply.');
            return;
        }

        const prompt = `Based on this chat conversation:\n\n${currentChatHistory.join('\n')}\n\nSuggest a short, casual reply as if you are ${auth.currentUser.displayName}.`;
        const suggestion = await callGeminiApi(prompt, e.target);
        if (suggestion) {
            messageInput.value = suggestion.replace(/"/g, ''); // Remove quotes
        }
    });

    summarizeChatBtn.addEventListener('click', async (e) => {
        if (currentChatHistory.length < 3) {
            showNotification('info', 'Not enough chat history to summarize.');
            return;
        }

        const prompt = `Summarize this chat conversation in one sentence:\n\n${currentChatHistory.join('\n')}`;
        const summary = await callGeminiApi(prompt, e.target);
        if (summary) {
            showNotification('info', `Summary: ${summary}`);
        }
    });

    // --- Notification System ---
    function showNotification(type, message) {
      const container = document.getElementById('notification-container');
      const notification = document.createElement('div');
      
      let icon, bgColor, textColor;
      switch(type) {
        case 'success':
          icon = 'fa-check-circle'; bgColor = 'bg-green-500'; textColor = 'text-white';
          break;
        case 'error':
          icon = 'fa-exclamation-circle'; bgColor = 'bg-red-500'; textColor = 'text-white';
          break;
        default: // info
          icon = 'fa-info-circle'; bgColor = 'bg-blue-500'; textColor = 'text-white';
          break;
      }
      
      notification.className = `notification ${bgColor} ${textColor} px-4 py-3 rounded-lg shadow-lg flex items-center w-full max-w-sm`;
      notification.innerHTML = `
        <i class="fas ${icon} mr-3"></i>
        <span>${message}</span>
      `;
      
      container.appendChild(notification);
      
      setTimeout(() => {
        notification.remove();
      }, 4500);
    }

    // --- Authentication ---
    
    showRegister.addEventListener('click', (e) => { e.preventDefault(); loginForm.classList.add('hidden'); registerForm.classList.remove('hidden'); });
    showLogin.addEventListener('click', (e) => { e.preventDefault(); registerForm.classList.add('hidden'); loginForm.classList.remove('hidden'); });

    document.getElementById('register-btn').addEventListener('click', async () => {
      const name = document.getElementById('register-name').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      if (!name || !email || !password) { showNotification("error", "Please fill all fields."); return; }
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        const photoURL = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random&color=fff`;
        await updateProfile(user, { displayName: name, photoURL: photoURL });
        await setDoc(doc(db, "users", user.uid), { uid: user.uid, name, email, photoURL, status: "online", lastSeen: serverTimestamp(), friends: [], friendRequests: [] });
      } catch (error) { showNotification("error", error.message); }
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      try { await signInWithEmailAndPassword(auth, email, password); } catch (error) { showNotification("error", error.message); }
    });

    document.getElementById('google-login-btn').addEventListener('click', async () => {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (!userDoc.exists()) {
          await setDoc(doc(db, "users", user.uid), { uid: user.uid, name: user.displayName, email: user.email, photoURL: user.photoURL, status: "online", lastSeen: serverTimestamp(), friends: [], friendRequests: [] });
        }
      } catch (error) { showNotification("error", error.message); }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      if (auth.currentUser) {
        await updateDoc(doc(db, "users", auth.currentUser.uid), { status: "offline", lastSeen: serverTimestamp() });
      }
      await signOut(auth);
    });

    onAuthStateChanged(auth, user => {
      if (user) {
        authScreen.classList.add('hidden');
        chatScreen.classList.remove('hidden');
        chatScreen.classList.add('flex');
        updateDoc(doc(db, "users", user.uid), { status: "online", lastSeen: serverTimestamp() });
        loadUserProfile(user);
        listenForFriendsAndRequests(user);
      } else {
        chatScreen.classList.add('hidden');
        chatScreen.classList.remove('flex');
        authScreen.classList.remove('hidden');
        if (unsubscribeFriends) unsubscribeFriends();
        if (unsubscribeRequests) unsubscribeRequests();
      }
    });

    // --- UI & Chat Logic ---

    function loadUserProfile(user) {
        onSnapshot(doc(db, "users", user.uid), (doc) => {
            if (doc.exists()) {
                const userData = doc.data();
                document.getElementById('user-profile').innerHTML = `
                  <img src="${userData.photoURL}" alt="Profile" class="w-12 h-12 rounded-full mr-3">
                  <div><p class="font-semibold text-lg">${userData.name}</p></div>`;
            }
        });
    }

    // --- Friend System & User Search ---

    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

    searchInput.addEventListener('input', debounce(async (e) => {
        const searchText = e.target.value.trim().toLowerCase();
        if (searchText.length < 2) { searchResults.innerHTML = ''; return; }

        const usersRef = collection(db, "users");
        const q = query(usersRef, where("name", ">=", searchText), where("name", "<=", searchText + '\uf8ff'));
        
        const querySnapshot = await getDocs(q);
        const currentUserDoc = await getDoc(doc(db, "users", auth.currentUser.uid));
        const { friends = [], friendRequests = [] } = currentUserDoc.data();
        
        searchResults.innerHTML = '';
        querySnapshot.forEach(doc => {
            const user = doc.data();
            if (user.uid === auth.currentUser.uid) return;

            let buttonHtml = `<button data-uid="${user.uid}" class="add-friend-btn bg-indigo-500 text-white px-3 py-1 rounded-lg text-sm hover:bg-indigo-600">Add</button>`;
            if (friends.includes(user.uid)) {
                buttonHtml = `<span class="text-sm text-gray-500">Friend</span>`;
            } // We can add a "Pending" state later if needed

            searchResults.innerHTML += `
                <div class="flex items-center justify-between p-2 hover:bg-gray-50 rounded">
                    <div class="flex items-center">
                        <img src="${user.photoURL}" class="w-8 h-8 rounded-full mr-2">
                        <span>${user.name}</span>
                    </div>
                    ${buttonHtml}
                </div>
            `;
        });
    }, 300));
    
    searchResults.addEventListener('click', (e) => {
        if (e.target.classList.contains('add-friend-btn')) {
            const targetUid = e.target.dataset.uid;
            sendFriendRequest(targetUid);
        }
    });

    async function sendFriendRequest(targetUid) {
        if (!auth.currentUser) return;
        const targetRef = doc(db, "users", targetUid);
        await updateDoc(targetRef, { friendRequests: arrayUnion(auth.currentUser.uid) });
        showNotification('success', 'Friend request sent!');
    }

    function listenForFriendsAndRequests(user) {
        if (unsubscribeFriends) unsubscribeFriends();
        const userRef = doc(db, "users", user.uid);
        unsubscribeFriends = onSnapshot(userRef, async (userDoc) => {
            if (!userDoc.exists()) return;
            const { friends = [], friendRequests = [] } = userDoc.data();
            
            // Render Friend Requests
            requestCountBadge.textContent = friendRequests.length || '';
            if (friendRequests.length > 0) {
                friendRequestsContainer.innerHTML = '';
                for (const uid of friendRequests) {
                    const requesterDoc = await getDoc(doc(db, "users", uid));
                    if (requesterDoc.exists()) {
                        const requester = requesterDoc.data();
                        friendRequestsContainer.innerHTML += `
                            <div class="flex items-center justify-between p-2">
                                <div class="flex items-center">
                                    <img src="${requester.photoURL}" class="w-8 h-8 rounded-full mr-2">
                                    <span>${requester.name}</span>
                                </div>
                                <div>
                                    <button data-uid="${uid}" class="accept-request-btn text-green-500 hover:text-green-700 mr-2"><i class="fas fa-check-circle"></i></button>
                                    <button data-uid="${uid}" class="reject-request-btn text-red-500 hover:text-red-700"><i class="fas fa-times-circle"></i></button>
                                </div>
                            </div>
                        `;
                    }
                }
            } else {
                friendRequestsContainer.innerHTML = '<div class="text-gray-500 text-center py-4">No new requests</div>';
            }

            // Render Friends List
            friendCountBadge.textContent = friends.length || '';
            if (friends.length > 0) {
                friendsListContainer.innerHTML = '';
                for (const uid of friends) {
                    const friendDoc = await getDoc(doc(db, "users", uid));
                    if (friendDoc.exists()) {
                        const friend = friendDoc.data();
                        friendsListContainer.innerHTML += `
                            <div data-uid="${friend.uid}" class="friend-item flex items-center p-2 cursor-pointer hover:bg-gray-100 rounded">
                                <div class="relative">
                                    <img src="${friend.photoURL}" class="w-10 h-10 rounded-full mr-3">
                                    <span class="absolute bottom-0 right-3 w-2.5 h-2.5 ${friend.status === 'online' ? 'bg-green-500' : 'bg-gray-400'} border border-white rounded-full"></span>
                                </div>
                                <span>${friend.name}</span>
                            </div>
                        `;
                    }
                }
            } else {
                friendsListContainer.innerHTML = '<div class="text-gray-500 text-center py-4">No friends yet</div>';
            }
        });
    }

    friendRequestsContainer.addEventListener('click', async (e) => {
        const button = e.target.closest('button');
        if (!button) return;
        const uid = button.dataset.uid;
        const currentUserRef = doc(db, "users", auth.currentUser.uid);

        if (button.classList.contains('accept-request-btn')) {
            const friendRef = doc(db, "users", uid);
            await updateDoc(currentUserRef, { friendRequests: arrayRemove(uid), friends: arrayUnion(uid) });
            await updateDoc(friendRef, { friends: arrayUnion(auth.currentUser.uid) });
            showNotification('success', 'Friend added!');
        }
        if (button.classList.contains('reject-request-btn')) {
            await updateDoc(currentUserRef, { friendRequests: arrayRemove(uid) });
            showNotification('info', 'Request rejected.');
        }
    });
    
    friendsListContainer.addEventListener('click', async (e) => {
        const item = e.target.closest('.friend-item');
        if (!item) return;
        const uid = item.dataset.uid;
        const friendDoc = await getDoc(doc(db, "users", uid));
        if (friendDoc.exists()) {
            startChat(friendDoc.data());
        }
    });

    function startChat(partner) {
        currentChatPartner = partner;
        welcomeScreen.classList.add('hidden');
        chatArea.classList.remove('hidden');
        chatArea.classList.add('flex');
        
        // Mobile view: show chat, hide sidebar
        if (window.innerWidth < 768) {
            sidebar.classList.add('-translate-x-full');
            mainChat.classList.remove('translate-x-full');
        }

        chatHeader.querySelector('.flex.items-center').innerHTML = `
            <button id="back-to-sidebar" class="md:hidden text-gray-500 mr-4">
                <i class="fas fa-arrow-left"></i>
            </button>
            <img src="${partner.photoURL}" alt="${partner.name}" class="w-10 h-10 rounded-full mr-3">
            <div>
                <p class="font-semibold">${partner.name}</p>
                <p class="text-sm ${partner.status === 'online' ? 'text-green-500' : 'text-gray-500'}">${partner.status}</p>
            </div>
        `;
        loadMessages();
    }
    
    // Mobile navigation
    backToSidebarBtn.addEventListener('click', () => {
        sidebar.classList.remove('-translate-x-full');
        mainChat.classList.add('translate-x-full');
        currentChatPartner = null;
        if(unsubscribeMessages) unsubscribeMessages();
    });
    
    // Accordion logic
    document.querySelectorAll('.accordion-header').forEach(header => {
        header.addEventListener('click', () => {
            const content = header.nextElementSibling;
            const icon = header.querySelector('.accordion-icon');
            icon.classList.toggle('rotate-180');
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
            }
        });
    });

    // Load messages for the current chat
    function loadMessages() {
        if (!currentChatPartner || !auth.currentUser) return;
        if (unsubscribeMessages) unsubscribeMessages();

        const chatId = [auth.currentUser.uid, currentChatPartner.uid].sort().join('_');
        const messagesRef = collection(db, "chats", chatId, "messages");
        const q = query(messagesRef, orderBy("timestamp"));

        unsubscribeMessages = onSnapshot(q, (snapshot) => {
            messagesArea.innerHTML = '';
            currentChatHistory = [];
            snapshot.forEach(doc => {
                const msg = doc.data();
                const senderName = msg.senderId === auth.currentUser.uid ? auth.currentUser.displayName : currentChatPartner.name;
                currentChatHistory.push(`${senderName}: ${msg.text}`);

                const isCurrentUser = msg.senderId === auth.currentUser.uid;
                const messageElement = document.createElement('div');
                messageElement.className = `flex mb-4 message-enter ${isCurrentUser ? 'justify-end' : 'justify-start'}`;
                
                const time = msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';

                messageElement.innerHTML = `
                    <div class="chat-bubble p-3 rounded-lg ${isCurrentUser ? 'chat-bubble-user' : 'chat-bubble-other shadow'}">
                        <p>${msg.text}</p>
                        <p class="text-xs text-right mt-1 ${isCurrentUser ? 'text-indigo-200' : 'text-gray-400'}">${time}</p>
                    </div>
                `;
                messagesArea.appendChild(messageElement);
            });
            messagesArea.scrollTop = messagesArea.scrollHeight;
        });
    }

    // Send a message
    async function sendMessage() {
        const text = messageInput.value.trim();
        if (text === '' || !currentChatPartner || !auth.currentUser) return;

        const chatId = [auth.currentUser.uid, currentChatPartner.uid].sort().join('_');
        const messagesRef = collection(db, "chats", chatId, "messages");

        try {
            await addDoc(messagesRef, {
                text: text,
                senderId: auth.currentUser.uid,
                receiverId: currentChatPartner.uid,
                timestamp: serverTimestamp()
            });
            messageInput.value = '';
            messagesArea.scrollTop = messagesArea.scrollHeight;
        } catch (error) {
            console.error("Error sending message: ", error);
            showNotification("error", "Could not send message.");
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

  </script>
</body>
</html>
