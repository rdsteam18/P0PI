<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P0PI - Chat App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom scrollbar for a cleaner look */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
    /* Additional styles for a polished UI */
    .chat-bubble {
      max-width: 75%;
    }
  </style>
</head>
<body class="bg-gray-100 h-screen">

  <!-- Main Application Container -->
  <div id="app" class="h-full flex">

    <!-- Authentication Screen -->
    <div id="auth-screen" class="w-full h-full flex items-center justify-center bg-indigo-50">
      <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h1 class="text-3xl font-bold text-indigo-700 mb-6 text-center">
          <i class="fas fa-graduation-cap mr-2"></i>P0PI
        </h1>
        <div id="auth-container">
          <!-- Login Form -->
          <div id="login-form">
            <input type="email" id="login-email" placeholder="Email" class="w-full p-3 mb-4 border rounded-lg">
            <input type="password" id="login-password" placeholder="Password" class="w-full p-3 mb-4 border rounded-lg">
            <button id="login-btn" class="w-full bg-indigo-600 text-white p-3 rounded-lg font-semibold hover:bg-indigo-700">Login</button>
            <p class="text-center text-gray-500 my-4">OR</p>
            <button id="google-login-btn" class="w-full bg-white border border-gray-300 p-3 rounded-lg flex items-center justify-center hover:bg-gray-50">
              <i class="fab fa-google mr-2 text-red-500"></i> Login with Google
            </button>
            <p class="text-center mt-4">
              Don't have an account? <a href="#" id="show-register" class="text-indigo-600">Register</a>
            </p>
          </div>
          <!-- Registration Form (hidden by default) -->
          <div id="register-form" class="hidden">
            <input type="text" id="register-name" placeholder="Full Name" class="w-full p-3 mb-4 border rounded-lg">
            <input type="email" id="register-email" placeholder="Email" class="w-full p-3 mb-4 border rounded-lg">
            <input type="password" id="register-password" placeholder="Password" class="w-full p-3 mb-4 border rounded-lg">
            <button id="register-btn" class="w-full bg-indigo-600 text-white p-3 rounded-lg font-semibold hover:bg-indigo-700">Register</button>
            <p class="text-center mt-4">
              Already have an account? <a href="#" id="show-login" class="text-indigo-600">Login</a>
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Chat Interface (hidden by default) -->
    <div id="chat-screen" class="hidden w-full h-full flex">
      <!-- Sidebar -->
      <aside class="w-1/3 bg-white border-r border-gray-200 flex flex-col">
        <!-- Sidebar Header -->
        <header class="p-4 border-b border-gray-200 flex justify-between items-center">
          <div id="user-profile" class="flex items-center">
            <!-- User profile info will be injected here -->
          </div>
          <button id="logout-btn" class="text-gray-500 hover:text-indigo-600">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </header>
        <!-- Search Bar -->
        <div class="p-4">
          <input type="text" placeholder="Search chats..." class="w-full p-2 border rounded-lg bg-gray-100">
        </div>
        <!-- Recent Chats -->
        <div id="recent-chats" class="flex-1 overflow-y-auto">
          <!-- Recent chat items will be injected here -->
        </div>
      </aside>

      <!-- Main Chat Window -->
      <main class="w-2/3 flex flex-col">
        <!-- Chat Header -->
        <header id="chat-header" class="p-4 bg-white border-b border-gray-200 flex items-center">
          <!-- Chat partner info will be injected here -->
        </header>
        <!-- Messages Area -->
        <div id="messages-area" class="flex-1 p-4 overflow-y-auto bg-gray-50">
          <!-- Messages will be injected here -->
        </div>
        <!-- Message Input -->
        <footer class="p-4 bg-white">
          <div class="flex items-center">
            <button class="text-gray-500 mr-2 hover:text-indigo-600">
              <i class="fas fa-paperclip"></i>
            </button>
            <input type="text" id="message-input" placeholder="Type a message..." class="flex-1 p-3 border rounded-lg bg-gray-100">
            <button id="send-btn" class="bg-indigo-600 text-white p-3 rounded-lg ml-2">
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
        </footer>
      </main>
    </div>

  </div>

  <script type="module">
    // Firebase SDK imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signInWithPopup, 
      GoogleAuthProvider, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc,
      collection,
      addDoc,
      serverTimestamp,
      query,
      orderBy,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCWQWPa3OEH6ClFQ5gv9yswr8N1Yh1vstE",
      authDomain: "study-chat-app-4a40e.firebaseapp.com",
      projectId: "study-chat-app-4a40e",
      storageBucket: "study-chat-app-4a40e.appspot.com",
      messagingSenderId: "458309548485",
      appId: "1:458309548485:web:5dcccac12a7487b0d273ac",
      measurementId: "G-HQTQLDYT0Q"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // DOM Elements
    const authScreen = document.getElementById('auth-screen');
    const chatScreen = document.getElementById('chat-screen');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const showRegister = document.getElementById('show-register');
    const showLogin = document.getElementById('show-login');

    // --- Authentication ---
    
    // Toggle between login and register forms
    showRegister.addEventListener('click', () => {
      loginForm.classList.add('hidden');
      registerForm.classList.remove('hidden');
    });

    showLogin.addEventListener('click', () => {
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
    });

    // Email/Password Registration
    document.getElementById('register-btn').addEventListener('click', async () => {
      const name = document.getElementById('register-name').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        
        // Save user profile to Firestore
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          name: name,
          email: user.email,
          photoURL: user.photoURL || `https://ui-avatars.com/api/?name=${name}&background=random`,
          status: "online"
        });

      } catch (error) {
        alert(error.message);
      }
    });

    // Email/Password Login
    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        alert(error.message);
      }
    });

    // Google Login
    document.getElementById('google-login-btn').addEventListener('click', async () => {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;

        // Check if user exists in Firestore, if not, create a profile
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (!userDoc.exists()) {
          await setDoc(doc(db, "users", user.uid), {
            uid: user.uid,
            name: user.displayName,
            email: user.email,
            photoURL: user.photoURL,
            status: "online"
          });
        }
      } catch (error) {
        alert(error.message);
      }
    });

    // Logout
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut(auth);
    });

    // Auth state listener
    onAuthStateChanged(auth, user => {
      if (user) {
        // User is signed in
        authScreen.classList.add('hidden');
        chatScreen.classList.remove('hidden');
        chatScreen.classList.add('flex');
        loadUserProfile(user);
        loadRecentChats(user);
      } else {
        // User is signed out
        chatScreen.classList.add('hidden');
        chatScreen.classList.remove('flex');
        authScreen.classList.remove('hidden');
      }
    });

    // --- UI Updates ---

    // Load user profile in the sidebar
    async function loadUserProfile(user) {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) {
        const userData = userDoc.data();
        const userProfile = document.getElementById('user-profile');
        userProfile.innerHTML = `
          <img src="${userData.photoURL}" alt="Profile Picture" class="w-10 h-10 rounded-full mr-3">
          <div>
            <p class="font-semibold">${userData.name}</p>
            <p class="text-sm text-green-500">${userData.status}</p>
          </div>
        `;
      }
    }

    // Load recent chats in the sidebar
    function loadRecentChats(user) {
      // This is a placeholder for now. We'll implement this fully later.
      const recentChats = document.getElementById('recent-chats');
      recentChats.innerHTML = `
        <div class="p-4 text-gray-500">
          Recent chats will appear here.
        </div>
      `;
    }

  </script>
</body>
</html>
